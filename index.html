<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-prime 촬영 일정 조율</title>
<style>
  :root{
    --navy:#0F172A; --navy2:#1E293B; --orange:#F59E0B; --orange-d:#D97706;
    --line:#E2E8F0; --muted:#64748B; --bg:#F8FAFC;
    --ok:#16A34A; --ok-l:#DCFCE7; --no:#DC2626; --no-l:#FEE2E2; --maybe:#CA8A04; --maybe-l:#FEF9C3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--navy);-webkit-font-smoothing:antialiased}
  header{background:var(--navy);color:#fff;border-bottom:3px solid var(--orange)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
  .hd h1{margin:0;font-size:22px;letter-spacing:-.3px}
  .hd h1 small{display:block;font-size:12px;font-weight:500;color:#94A3B8;margin-top:4px;letter-spacing:0}
  .btn{border:1px solid #334155;background:var(--navy2);color:#E2E8F0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--orange)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .label.step{font-size:16px;margin-bottom:10px}
  .who{flex:1 1 520px}
  .groups{display:flex;flex-direction:column;gap:8px}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .grp b{font-size:12px;color:var(--muted);width:84px}
  .tag{font-size:10px;font-weight:700;color:var(--orange-d);margin-left:5px}
  .chip.on .tag{color:#FCD34D}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .chip:hover{border-color:var(--orange)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .guide{flex:1 1 300px;font-size:13px;line-height:1.6;color:#334155}
  .guide .k{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;font-size:12px;margin-right:4px}
  .k.ok{background:var(--ok-l);color:var(--ok)} .k.no{background:var(--no-l);color:var(--no)} .k.maybe{background:var(--maybe-l);color:var(--maybe)}
  .filter{display:flex;gap:6px;flex-wrap:wrap}
  .best{flex:1 1 340px}
  .best ol{margin:0;padding-left:18px;font-size:14px;line-height:1.8}
  .best .cnt{color:var(--ok);font-weight:700}
  .best .cnt-m{color:var(--maybe);font-weight:700}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
  @media(max-width:1100px){.months{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.months{grid-template-columns:1fr}}
  .month{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .month h2{margin:0;padding:12px 14px;font-size:16px;background:var(--navy2);color:#fff}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow div{font-size:11px;font-weight:700;text-align:center;padding:6px 0;color:var(--muted);border-bottom:1px solid var(--line)}
  .dow div:first-child{color:var(--no)} .dow div:last-child{color:#2563EB}
  .cell{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;transition:background .1s}
  .cell:nth-child(7n){border-right:none}
  .cell:hover{background:#FFFBEB}
  .cell.empty{background:#FAFAFA;cursor:default}
  .cell.sel{outline:2px solid var(--orange);outline-offset:-2px;z-index:1}
  .cell.past{opacity:.45}
  .d{font-size:13px;font-weight:700}
  .cell.sun .d,.cell.hol .d{color:var(--no)} .cell.sat .d{color:#2563EB}
  .hname{font-size:10px;color:var(--no);font-weight:600;line-height:1.1}
  .mine{position:absolute;top:5px;right:5px;font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px}
  .mine.ok{background:var(--ok);color:#fff} .mine.no{background:var(--no);color:#fff} .mine.maybe{background:var(--maybe);color:#fff}
  .bar{height:5px;border-radius:3px;background:#F1F5F9;overflow:hidden;display:flex;margin-top:auto}
  .bar i{display:block;height:100%}
  .bar .o{background:var(--ok)} .bar .m{background:var(--maybe)} .bar .n{background:var(--no)}
  .c{font-size:11px;color:var(--muted)} .c b{color:var(--ok)}
  .conf{font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail{position:sticky;bottom:0;z-index:5;margin-top:16px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:12px 12px 0 0;padding:14px 18px;box-shadow:0 -6px 20px rgba(15,23,42,.08)}
  .detail h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .setbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .setbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .setbtns .ok.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .setbtns .no.on{background:var(--no);color:#fff;border-color:var(--no)}
  .setbtns .maybe.on{background:var(--maybe);color:#fff;border-color:var(--maybe)}
  .setbtns .clr{color:var(--muted);font-weight:500}
  .lists{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px}
  @media(max-width:720px){.lists{grid-template-columns:1fr 1fr}}
  .lists div b{display:block;font-size:12px;margin-bottom:4px}
  .notice{background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:16px;display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 0 40px}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <h1 id="title">A-prime 촬영 일정 조율<small id="range">불러오는 중...</small></h1>
    <div><span id="updated" style="font-size:12px;color:#94A3B8;margin-right:8px"></span><button class="btn" id="reload">새로고침</button></div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice"></div>

  <div class="panel row">
    <div class="who">
      <div class="label step">① 내 이름을 먼저 고르세요</div>
      <div class="groups" id="members"></div>
    </div>
    <div class="guide">
      <div class="label step">② 날짜를 누르고 상태를 고르세요</div>
      <span class="k ok">가능</span><span class="k maybe">미정</span><br>
      달력 칸의 막대는 <b>가능 · 미정</b> 인원 비율입니다.<br>
      확정된 촬영일은 칸 안에 색 라벨로 표시됩니다.
    </div>
  </div>

  <div class="panel row">
    <div style="flex:1 1 300px">
      <div class="label">집계 기준 <span style="font-weight:500">· 촬영팀은 모든 콘텐츠에 포함</span></div>
      <div class="filter" id="filter"></div>
    </div>
    <div class="best">
      <div class="label">가능 인원이 가장 많은 날</div>
      <ol id="best"><li style="list-style:none;margin-left:-18px;color:var(--muted)">아직 응답이 없습니다</li></ol>
    </div>
    <div style="flex:1 1 260px">
      <div class="label">확정 촬영 구분</div>
      <div id="types" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div class="months" id="months"></div>

  <div class="detail" id="detail" style="display:none"></div>
</main>
<footer>A-prime × Purple Universe · 이 페이지의 선택은 모든 출연진·촬영팀에게 공유됩니다</footer>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwlpUoYdEqXXC9el-eQ_TM4ANReEfFc1MS-UI4pcmZ7zze-ZngGthLJOzAhZNLWQr3u/exec';

const HOLIDAYS = {
  '2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체공휴일','2027-03-01':'삼일절'
};
const TYPE_COLORS = {'본편(팟캐스트)':'#0F172A','번외편 여자편':'#DB2777','번외편 남자편':'#2563EB'};
const TYPE_ALIAS = {'본편':'본편(팟캐스트)','팟캐스트':'본편(팟캐스트)'};
const ST_CLS = {'가능':'ok','불가':'no','미정':'maybe'};
const DOW = ['일','월','화','수','목','금','토'];

let DATA = {config:{}, members:[], availability:[], confirmed:[]};
let me = null, selDate = null, groupFilter = '전체';
try { me = localStorage.getItem('aprime_me'); } catch(e){}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const todayStr = (()=>{const t=new Date();return ymd(t.getFullYear(),t.getMonth()+1,t.getDate());})();

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function notice(msg){ const n=$('notice'); n.style.display=msg?'block':'none'; n.textContent=msg||''; }

async function load(silent){
  try{
    const r = await fetch(API, {cache:'no-store'});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'error');
    DATA = j; DATA.confirmed.forEach(c=>{ c.type = TYPE_ALIAS[c.type] || c.type; }); notice('');
    const t=new Date(); $('updated').textContent = `업데이트 ${pad(t.getHours())}:${pad(t.getMinutes())}`;
  }catch(e){
    if(!silent) notice('데이터를 불러오지 못했습니다. 잠시 후 새로고침 해주세요. 계속되면 촬영팀에 알려주세요.');
  }
  render();
}

async function save(date, status){
  if(!me){ toast('먼저 내 이름을 골라주세요'); return; }
  // 화면 먼저 반영
  DATA.availability = DATA.availability.filter(a => !(a.date===date && a.name===me));
  if(status) DATA.availability.push({date, name:me, status});
  render();
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({date, name:me, status})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    toast(status ? `${date.slice(5).replace('-','/')} ${status} 저장됨` : '선택 취소됨');
  }catch(e){
    toast('저장 실패 — 다시 시도해주세요');
    load(true);
  }
}

const tagsOf = m => String(m.group||'').split('/').map(x=>x.trim()).filter(Boolean);
const homeOf = m => { const t = tagsOf(m); return t[t.length-1] || '기타'; };
const CREW = '촬영팀'; // 촬영팀은 모든 콘텐츠 집계에 항상 포함
function membersIn(group){ return DATA.members.filter(m => group==='전체' || tagsOf(m).includes(group) || tagsOf(m).includes(CREW)); }

function statsFor(date){
  const names = new Set(membersIn(groupFilter).map(m=>m.name));
  const s = {'가능':[], '미정':[], '불가':[]};
  DATA.availability.forEach(a => { if(a.date===date && names.has(a.name) && s[a.status]) s[a.status].push(a.name); });
  const answered = new Set([...s['가능'],...s['미정'],...s['불가']]);
  s['미응답'] = [...names].filter(n=>!answered.has(n));
  s.total = names.size;
  return s;
}

function render(){
  const cfg = DATA.config || {};
  const title = cfg.title || 'A-prime 촬영 일정 조율';
  document.title = title;
  const [sy, sm] = (cfg.startMonth || todayStr.slice(0,7)).split('-').map(Number);
  const months = cfg.months || 3;
  const endM = new Date(sy, sm-1+months-1, 1);
  $('title').innerHTML = `${title}<small>${sy}년 ${sm}월 ~ ${endM.getFullYear()}년 ${endM.getMonth()+1}월 · 총 ${DATA.members.length}명</small>`;

  // 멤버
  const groups = [...new Set(DATA.members.map(homeOf))];
  const allTags = [...new Set(DATA.members.flatMap(tagsOf))].sort((x,y)=> (y==='팟캐스트')-(x==='팟캐스트'));
  if(me && !DATA.members.some(m=>m.name===me) && DATA.members.length) me = null;
  $('members').innerHTML = groups.map(g => `<div class="grp"><b>${g}</b>${
    DATA.members.filter(m=>homeOf(m)===g).map(m=>`<button class="chip ${m.name===me?'on':''}" data-name="${m.name}">${m.name}${tagsOf(m).length>1?`<span class="tag">${tagsOf(m).slice(0,-1).join('·')}</span>`:''}</button>`).join('')
  }</div>`).join('') || '<span class="c">멤버 불러오는 중...</span>';

  // 필터
  $('filter').innerHTML = ['전체', ...allTags.filter(t=>t!==CREW)].map(g=>`<button class="chip ${g===groupFilter?'on':''}" data-group="${g}">${g}</button>`).join('');

  // 확정 구분 범례
  $('types').innerHTML = Object.entries(TYPE_COLORS).map(([k,c])=>`<span class="conf" style="background:${c};font-size:12px;padding:3px 8px">${k}</span>`).join('');

  // 달력
  const conf = {}; DATA.confirmed.forEach(c => (conf[c.date] = conf[c.date]||[]).push(c));
  const mineMap = {}; DATA.availability.forEach(a => { if(a.name===me) mineMap[a.date]=a.status; });
  const allDates = [];
  let html = '';
  for(let i=0;i<months;i++){
    const dt = new Date(sy, sm-1+i, 1), y=dt.getFullYear(), m=dt.getMonth()+1;
    const first = dt.getDay(), days = new Date(y, m, 0).getDate();
    html += `<section class="month"><h2>${y}년 ${m}월</h2><div class="dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="grid">`;
    for(let e=0;e<first;e++) html += `<div class="cell empty"></div>`;
    for(let d=1; d<=days; d++){
      const key = ymd(y,m,d), w = (first+d-1)%7; allDates.push(key);
      const s = statsFor(key), tot = s.total||1;
      const cls = ['cell', w===0?'sun':'', w===6?'sat':'', HOLIDAYS[key]?'hol':'', key<todayStr?'past':'', key===selDate?'sel':''].join(' ');
      const mine = mineMap[key] ? `<span class="mine ${ST_CLS[mineMap[key]]}">${mineMap[key]}</span>` : '';
      const confs = (conf[key]||[]).map(c=>`<span class="conf" style="background:${TYPE_COLORS[c.type]||'#475569'}" title="${c.memo||''}">${c.type}</span>`).join('');
      html += `<div class="${cls}" data-date="${key}">
        <span class="d">${d}</span>${HOLIDAYS[key]?`<span class="hname">${HOLIDAYS[key]}</span>`:''}${mine}${confs}
        ${s['가능'].length||s['미정'].length ? `<span class="c">가능 <b>${s['가능'].length}</b>/${s.total}</span>`:''}
        <div class="bar"><i class="o" style="width:${s['가능'].length/tot*100}%"></i><i class="m" style="width:${s['미정'].length/tot*100}%"></i></div>
      </div>`;
    }
    html += `</div></section>`;
  }
  $('months').innerHTML = html;

  // 베스트 날짜
  const ranked = allDates.filter(k=>k>=todayStr).map(k=>({k, s:statsFor(k)})).filter(x=>x.s['가능'].length>0)
    .sort((a,b)=> b.s['가능'].length-a.s['가능'].length || b.s['미정'].length-a.s['미정'].length || a.k.localeCompare(b.k)).slice(0,5);
  $('best').innerHTML = ranked.length ? ranked.map(x=>{
    const dt=new Date(x.k+'T00:00:00');
    return `<li><a href="#" data-jump="${x.k}" style="color:inherit">${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})</a> — <span class="cnt">가능 ${x.s['가능'].length}명</span> / ${x.s.total}명${x.s['미정'].length?` · <span class="cnt-m">미정 ${x.s['미정'].length}명</span>`:''}</li>`;
  }).join('') : '<li style="list-style:none;margin-left:-18px;color:var(--muted)">아직 응답이 없습니다</li>';

  renderDetail();
}

function renderDetail(){
  const box = $('detail');
  if(!selDate){ box.style.display='none'; return; }
  const dt = new Date(selDate+'T00:00:00');
  const s = statsFor(selDate);
  const mine = (DATA.availability.find(a=>a.date===selDate && a.name===me)||{}).status || '';
  const confs = DATA.confirmed.filter(c=>c.date===selDate).map(c=>`<span class="conf" style="background:${TYPE_COLORS[c.type]||'#475569'};font-size:12px;padding:3px 8px">${c.type}${c.memo?' · '+c.memo:''}</span>`).join(' ');
  box.style.display='block';
  box.innerHTML = `
    <h3>${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})${HOLIDAYS[selDate]?` <span class="hname" style="font-size:12px">${HOLIDAYS[selDate]}</span>`:''} ${confs}
      <button class="btn" id="closeDetail" style="margin-left:auto;background:#fff;color:var(--muted);border-color:var(--line)">닫기</button></h3>
    ${me ? `<div class="setbtns">
        <span class="c" style="align-self:center;margin-right:4px"><b style="color:var(--navy)">${me}</b> 님은</span>
        ${['가능','미정'].map(st=>`<button class="${ST_CLS[st]} ${mine===st?'on':''}" data-set="${st}">${st}</button>`).join('')}
        ${mine?`<button class="clr" data-set="">선택 취소</button>`:''}
      </div>` : `<div class="c" style="margin-bottom:10px">위에서 <b style="color:var(--orange-d)">내 이름</b>을 먼저 고르면 이 날짜에 표시할 수 있어요.</div>`}
    <div class="lists">
      <div><b style="color:var(--ok)">가능 ${s['가능'].length}</b>${s['가능'].join(', ')||'-'}</div>
      <div><b style="color:var(--maybe)">미정 ${s['미정'].length}</b>${s['미정'].join(', ')||'-'}</div>
      <div><b style="color:var(--muted)">미응답 ${s['미응답'].length}</b>${s['미응답'].join(', ')||'-'}</div>
    </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-name],[data-group],[data-date],[data-set],[data-jump],#closeDetail,#reload');
  if(!t) return;
  if(t.id==='reload'){ load(); return; }
  if(t.id==='closeDetail'){ selDate=null; render(); return; }
  if(t.dataset.name!==undefined){ me = (me===t.dataset.name)?null:t.dataset.name; try{ me?localStorage.setItem('aprime_me',me):localStorage.removeItem('aprime_me'); }catch(_){} render(); return; }
  if(t.dataset.group!==undefined){ groupFilter=t.dataset.group; render(); return; }
  if(t.dataset.set!==undefined){ save(selDate, t.dataset.set); return; }
  if(t.dataset.jump){ e.preventDefault(); selDate=t.dataset.jump; render(); document.querySelector(`[data-date="${selDate}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(t.dataset.date){ selDate = (selDate===t.dataset.date)?null:t.dataset.date; render(); }
});

load();
setInterval(()=>load(true), 60000);
</script>
</body>
</html>
